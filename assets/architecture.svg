<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d">
  <title id="t">Curriculum map</title>
  <desc id="d">Eleven notebooks in three tiers, joined by orthogonal connectors to the package and test suite.</desc>
  <style>
    .bg{fill:#0B0F19}
    .box{fill:#111827;stroke:#F97316;stroke-width:1.5}
    .box2{fill:#111827;stroke:#F43F5E;stroke-width:1.5}
    .box3{fill:#111827;stroke:#7C3AED;stroke-width:1.5}
    .core{fill:#111827;stroke:#FBBF24;stroke-width:2}
    .t{fill:#F9FAFB;font:600 14px system-ui,-apple-system,"Segoe UI",sans-serif}
    .s{fill:#9CA3AF;font:12px ui-monospace,Consolas,monospace}
    .h{fill:#FBBF24;font:700 13px system-ui,sans-serif;letter-spacing:.08em}
    .wire{fill:none;stroke:#FBBF24;stroke-width:2;stroke-dasharray:6 6;animation:flow 1.4s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-24}}
    @media (prefers-reduced-motion:reduce){.wire{animation:none}}
  </style>
  <rect class="bg" width="1000" height="470"/>
  <text class="h" x="40" y="36">FOUNDATIONS</text>
  <text class="h" x="520" y="36">STRUCTURES</text>
  <text class="h" x="760" y="36">ALGORITHMS</text>

  <rect class="box" x="40" y="52" width="200" height="64" rx="8"/>
  <text class="t" x="56" y="78">01 Memory model</text><text class="s" x="56" y="98">refcount, gc, dis</text>
  <rect class="box" x="40" y="146" width="200" height="64" rx="8"/>
  <text class="t" x="56" y="172">02 Typing</text><text class="s" x="56" y="192">PEP 695, Protocol</text>
  <rect class="box" x="40" y="240" width="200" height="64" rx="8"/>
  <text class="t" x="56" y="266">03 Iterators</text><text class="s" x="56" y="286">generators, itertools</text>

  <rect class="box" x="280" y="52" width="200" height="64" rx="8"/>
  <text class="t" x="296" y="78">04 Decorators</text><text class="s" x="296" y="98">closures, with</text>
  <rect class="box" x="280" y="146" width="200" height="64" rx="8"/>
  <text class="t" x="296" y="172">05 Objects</text><text class="s" x="296" y="192">dunders, slots</text>
  <rect class="box" x="280" y="240" width="200" height="64" rx="8"/>
  <text class="t" x="296" y="266">06 Concurrency</text><text class="s" x="296" y="286">GIL, asyncio</text>

  <rect class="box2" x="520" y="52" width="200" height="64" rx="8"/>
  <text class="t" x="536" y="78">07 Arrays, hashing</text><text class="s" x="536" y="98">dict, LRU</text>
  <rect class="box2" x="520" y="146" width="200" height="64" rx="8"/>
  <text class="t" x="536" y="172">08 Trees, heaps</text><text class="s" x="536" y="192">AVL, tries</text>

  <rect class="box3" x="760" y="52" width="200" height="64" rx="8"/>
  <text class="t" x="776" y="78">09 Graphs</text><text class="s" x="776" y="98">Dijkstra, A*</text>
  <rect class="box3" x="760" y="146" width="200" height="64" rx="8"/>
  <text class="t" x="776" y="172">10 Dynamic prog.</text><text class="s" x="776" y="192">knapsack, LCS</text>
  <rect class="box3" x="760" y="240" width="200" height="64" rx="8"/>
  <text class="t" x="776" y="266">11 Complexity</text><text class="s" x="776" y="286">timeit, plots</text>

  <rect class="core" x="180" y="372" width="640" height="76" rx="8"/>
  <text class="t" x="200" y="398">src/understanding_python</text>
  <text class="s" x="200" y="418">internals, functional, typing_tools, oop, patterns, concurrency</text>
  <text class="s" x="200" y="436">hashing, structures, heaps, trees, graphs, pathfinding, dp, bench</text>

  <path class="wire" d="M140 116 V146"/>
  <path class="wire" d="M140 210 V240"/>
  <path class="wire" d="M240 272 H260 V84 H280"/>
  <path class="wire" d="M380 116 V146"/>
  <path class="wire" d="M380 210 V240"/>
  <path class="wire" d="M480 272 H500 V84 H520"/>
  <path class="wire" d="M620 116 V146"/>
  <path class="wire" d="M720 178 H740 V84 H760"/>
  <path class="wire" d="M860 116 V146"/>
  <path class="wire" d="M860 210 V240"/>
  <path class="wire" d="M140 304 V340 H300 V372"/>
  <path class="wire" d="M380 304 V372"/>
  <path class="wire" d="M620 210 V372"/>
  <path class="wire" d="M860 304 V340 H700 V372"/>
</svg>
